<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="chx-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0051FF"/>
    </linearGradient>
    <linearGradient id="chx-grad-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F3FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="chx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Technical Ring Segments -->
  <circle cx="24" cy="24" r="21" stroke="#00F3FF" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="8 6 18 6" />
  <circle cx="24" cy="24" r="17" stroke="#00F3FF" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="4 4" />
  
  <!-- Outer Shield Hex Structure -->
  <polygon points="24,5 41,14 41,31 24,43 7,31 7,14" stroke="url(#chx-grad-cyan)" stroke-width="1.8" fill="none" filter="url(#chx-glow)"/>
  
  <!-- Angular Hunting Crosshairs -->
  <line x1="24" y1="2" x2="24" y2="9" stroke="#00F3FF" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="39" x2="24" y2="46" stroke="#00F3FF" stroke-width="2" stroke-linecap="round" />
  <line x1="2" y1="24" x2="9" y2="24" stroke="#00F3FF" stroke-width="2" stroke-linecap="round" />
  <line x1="39" y1="24" x2="46" y2="24" stroke="#00F3FF" stroke-width="2" stroke-linecap="round" />
  
  <!-- The Aggressive 'X' Interceptor Wings -->
  <path d="M15 15 L33 33" stroke="url(#chx-grad-cyan)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M33 15 L15 33" stroke="url(#chx-grad-cyan)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Central AI Core -->
  <circle cx="24" cy="24" r="4.5" fill="#05070A" stroke="#00F3FF" stroke-width="1.8" />
  <circle cx="24" cy="24" r="2" fill="#00F3FF" filter="url(#chx-glow)" />
</svg>
